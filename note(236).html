<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NerdyFrogsGuide - Official Wiki</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        /* Nerdy Frog Theme - Retro Swamp Aesthetic */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/1/18/Swamp_forests_in_PNG.jpg');
            background-repeat: repeat;
            background-size: 300px;
            font-family: "Trebuchet MS", Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Window Container */
        .swamp-window {
            width: 90%;
            max-width: 1000px;
            height: 90vh;
            background: #1e2d1a; 
            border: 4px solid #0f1a0b;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Title Bar */
        .title-bar {
            height: 45px;
            background: linear-gradient(to bottom, #3a5f27 0%, #1e2d1a 100%);
            display: flex;
            align-items: center;
            padding: 0 15px;
            border-bottom: 2px solid #0f1a0b;
        }

        .title-text {
            color: #aaff00;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 2px 2px 0px #000;
            flex-grow: 1;
        }

        /* Content Area */
        .content-area {
            background: #f4f9f0;
            margin: 12px;
            flex-grow: 1;
            border: 3px inset #1e2d1a;
            padding: 40px;
            overflow-y: auto;
            color: #1a2e12;
            border-radius: 8px;
            line-height: 1.6;
        }

        /* Dynamic Guide List Styling */
        .guide-list {
            list-style: none;
            padding: 0;
            margin: 20px 0;
        }

        .guide-item {
            background: #e1edd6;
            margin-bottom: 8px;
            padding: 15px 25px;
            border-left: 5px solid #4e7d34;
            border-radius: 4px;
            transition: all 0.2s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .guide-item:hover {
            transform: translateX(10px);
            background: #d4e8c1;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }

        .guide-link {
            text-decoration: none;
            color: #1a2e12;
            font-weight: bold;
            font-size: 1.1em;
        }

        .btn-back {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #2d4c1e;
            color: #aaff00;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #aaff00;
        }

        .btn-back:hover {
            background: #3a5f27;
        }

        /* Scrollbar styling */
        .content-area::-webkit-scrollbar { width: 10px; }
        .content-area::-webkit-scrollbar-track { background: #d4e3c8; }
        .content-area::-webkit-scrollbar-thumb { background: #4e7d34; border-radius: 5px; }

        #loader { text-align: center; font-style: italic; color: #4e7d34; }
    </style>
</head>
<body>

    <div class="swamp-window">
        <div class="title-bar">
            <div class="title-text">𓆏 The Frog - ''Wiki''</div>
        </div>
        <div id="main-container" class="content-area">
            <div id="loader">Fetching swamp data...</div>
            <div id="wiki-content"></div>
        </div>
    </div>

    <script>
        // Configuration
        const OWNER = "TheFrogenSource";
        const REPO = "About-us";
        const PATH = "NerdyGuide";
        const MAIN_FILE = "NerdyGuide.md";
        const EXCLUDED_URL = "https://github.com/TheFrogenSource/About-us/blob/main/NerdyGuide/NerdyGuide.md";
        
        const API_URL = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
        const RAW_BASE = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${PATH}/`;

        async function init() {
            loadPage(MAIN_FILE);
        }

        async function loadPage(fileName) {
            const container = document.getElementById('wiki-content');
            const loader = document.getElementById('loader');
            
            loader.style.display = "block";
            container.innerHTML = "";

            try {
                // Fetch the Markdown content
                const response = await fetch(RAW_BASE + fileName);
                if (!response.ok) throw new Error("File not found");
                let text = await response.text();

                // Inject the list if the //list// tag is present
                if (fileName === MAIN_FILE && text.includes("//list//")) {
                    const listHtml = await generateGithubList();
                    text = text.replace("//list//", listHtml);
                }

                loader.style.display = "none";
                
                // Add Back Button if not on homepage
                const backBtn = fileName !== MAIN_FILE ? '<div class="btn-back" onclick="init()">← Back to Guide Index</div>' : '';
                
                container.innerHTML = backBtn + marked.parse(text);

            } catch (error) {
                loader.style.display = "none";
                container.innerHTML = "<h2>Error</h2><p>The frogs couldn't retrieve the guide data. Check your internet connection or repository path.</p>";
            }
        }

        async function generateGithubList() {
            try {
                const response = await fetch(API_URL);
                const files = await response.json();
                
                let html = '<ul class="guide-list">';
                
                files.forEach(file => {
                    // Check if it's a markdown file and NOT the main index file
                    if (file.name.endsWith('.md') && file.name !== MAIN_FILE) {
                        const displayName = file.name.replace('.md', '').replace(/-/g, ' ');
                        html += `
                            <li class="guide-item" onclick="loadPage('${file.name}')">
                                <span class="guide-link">📄 ${displayName}</span>
                            </li>`;
                    }
                });

                html += '</ul>';
                return html;
            } catch (e) {
                return "<p>Failed to load the list of guides.</p>";
            }
        }

        // Initialize the app
        init();
    </script>
</body>
</html>
